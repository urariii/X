  --wine:#5c0f1c; --wine2:#7a1526; --cream:#f7f0df; --kraft:#c6a273;
  --ph:min(calc(100vh - 150px), calc((100vw - 28px) * 8 / 9));
  --ph:min(calc(100dvh - 150px), calc((100vw - 28px) * 8 / 9));
  --pw:calc(var(--ph) * 9 / 16);
}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{margin:0;height:100%;overflow:hidden}
body{
  font-family:"Cormorant Garamond",Georgia,serif;color:var(--wine);
  background-color:var(--kraft);
  background-image:
    url("data:image/svg+xml;utf8,<svg xmlns='http://www.w3.org/2000/svg' width='300' height='300'><filter id='n'><feTurbulence type='fractalNoise' baseFrequency='.9' numOctaves='3' stitchTiles='stitch'/><feColorMatrix values='0 0 0 0 .35  0 0 0 0 .22  0 0 0 0 .1  0 0 0 .55 0'/></filter><rect width='300' height='300' filter='url(%23n)'/></svg>"),
    url("data:image/svg+xml;utf8,<svg xmlns='http://www.w3.org/2000/svg' width='700' height='700'><filter id='f'><feTurbulence type='fractalNoise' baseFrequency='.012 .5' numOctaves='2' seed='4'/><feColorMatrix values='0 0 0 0 .45  0 0 0 0 .3  0 0 0 0 .15  0 0 0 .35 0'/></filter><rect width='700' height='700' filter='url(%23f)'/></svg>"),
    radial-gradient(ellipse at 50% 40%, #d3b083 0%, #c19b6a 55%, #a98355 100%);
}
.stage{position:fixed;inset:0;display:flex;align-items:center;justify-content:center;padding-top:34px;padding-bottom:84px}
/* scrapbook scraps on the table */
.scrap{position:absolute;pointer-events:none;filter:drop-shadow(0 3px 5px rgba(60,30,10,.35))}
.scrap.a{left:-30px;bottom:70px;width:210px;height:190px;background:var(--wine2);transform:rotate(-12deg);
  clip-path:polygon(0 8%,12% 0,30% 6%,55% 1%,80% 8%,100% 4%,96% 40%,100% 70%,92% 100%,60% 94%,30% 100%,8% 92%,2% 60%)}
.scrap.b{right:-20px;top:28px;width:230px;height:150px;transform:rotate(9deg);
  background:radial-gradient(circle,#7a6a54 0 3px,transparent 3.5px) 0 0/22px 22px,#f6edd8;
  clip-path:polygon(4% 0,38% 7%,70% 0,100% 6%,96% 45%,100% 86%,70% 100%,36% 92%,2% 100%,6% 50%)}
@media (max-width:760px){.scrap{display:none}}

.scene{perspective:2600px}
.book{position:relative;width:calc(var(--pw) * 2);height:var(--ph);transform-style:preserve-3d;
  transition:transform 1s cubic-bezier(.6,.05,.2,1);transform:translateX(calc(var(--pw) * -.5))}
.open .book{transform:translateX(0)}
.page,.leaf{position:absolute;top:0;left:50%;width:50%;height:100%}
.page{background:var(--cake) center/100% 100%;box-shadow:0 14px 26px rgba(50,25,8,.45),0 2px 4px rgba(50,25,8,.4);border-radius:0 3px 3px 0;overflow:hidden}
.page::after,.face.back::after{content:"";position:absolute;inset:0;pointer-events:none;
  background:linear-gradient(90deg,rgba(60,25,10,.28),rgba(60,25,10,0) 9%)}
.leaf{transform-origin:left center;transform-style:preserve-3d;transition:transform 1.1s cubic-bezier(.6,.05,.2,1);z-index:3;cursor:pointer}
.open .leaf{transform:rotateY(-180deg);cursor:default}
.face{position:absolute;inset:0;backface-visibility:hidden;-webkit-backface-visibility:hidden;overflow:visible}
.face.front{background:var(--cover) center/100% 100%;border-radius:0 3px 3px 0;box-shadow:0 14px 26px rgba(50,25,8,.45),0 2px 4px rgba(50,25,8,.4)}
.open .face.front{pointer-events:none}
.face.back{transform:rotateY(180deg);background:var(--env) center/100% 100%;border-radius:3px 0 0 3px;box-shadow:0 14px 26px rgba(50,25,8,.45)}
.face.back .clip{position:absolute;inset:0;overflow:hidden;border-radius:3px 0 0 3px}
.tape{position:absolute;width:26%;height:5.2%;z-index:9;pointer-events:none;opacity:.92;
  background:repeating-linear-gradient(45deg,rgba(122,21,38,.78) 0 7px,rgba(246,236,214,.82) 7px 14px);
  box-shadow:0 2px 3px rgba(40,15,5,.35);clip-path:polygon(0 0,100% 4%,97% 50%,100% 96%,0 100%,3% 52%)}
.tape.tr{top:-2.2%;right:-6%;transform:rotate(36deg)}
.tape.tl{top:-2.2%;left:-6%;transform:rotate(-36deg)}

#letter:focus{outline:none}#letter:focus-visible{outline:2px dashed var(--wine2);outline-offset:3px}
#letter{position:absolute;left:2.593%;top:24.323%;width:60.741%;height:45.625%;z-index:1;cursor:pointer;
  background:var(--letter) center/100% 100%;transform-origin:0 0;
  box-shadow:0 0 0 rgba(0,0,0,0);
  transition:transform .85s cubic-bezier(.3,.8,.25,1),box-shadow .85s,z-index 0s .6s}
#letter.lifted{z-index:6;transform:translate(var(--lx),var(--ly)) scale(var(--ls)) rotate(-1.2deg);
  box-shadow:0 12px 30px rgba(40,10,10,.5),0 2px 6px rgba(40,10,10,.4);transition:transform .85s cubic-bezier(.3,.8,.25,1),box-shadow .85s,z-index 0s 0s}
.front-env{position:absolute;inset:0;z-index:2;pointer-events:none;background:var(--env) center/100% 100%;
  -webkit-mask:var(--mask) center/100% 100% no-repeat;mask:var(--mask) center/100% 100% no-repeat}

/* candles */
.flame{position:absolute;transform-origin:50% 92%;will-change:transform,opacity;pointer-events:none;
  transition:opacity .3s ease-out;filter:drop-shadow(0 0 6px rgba(255,190,90,.75))}
.flame.out{opacity:0}
.smoke{position:absolute;width:5%;aspect-ratio:1;border-radius:50%;pointer-events:none;
  background:radial-gradient(circle,rgba(110,95,85,.55),rgba(110,95,85,0) 70%);animation:smoke 1.8s ease-out forwards}
@keyframes smoke{0%{transform:translate(-50%,0) scale(.5);opacity:0}15%{opacity:.9}100%{transform:translate(-20%,-420%) scale(2.6);opacity:0}}
.wish{position:absolute;left:50%;top:62%;width:80%;transform:translate(-50%,-50%) rotate(-3deg) scale(.6);opacity:0;pointer-events:none;
  padding:6% 7%;text-align:center;font-family:"Pinyon Script","Snell Roundhand",cursive;font-size:calc(var(--pw) * .125);line-height:1.1;color:var(--wine);
  background:linear-gradient(#f9f2e0,#efe3c8);filter:drop-shadow(0 6px 10px rgba(40,10,10,.4));
  clip-path:polygon(0 6%,10% 0,30% 5%,55% 0,80% 5%,100% 0,98% 45%,100% 95%,72% 100%,45% 94%,18% 100%,0 94%,3% 50%);
  transition:opacity .5s,transform .7s cubic-bezier(.3,1.5,.5,1)}
.wish.show{opacity:1;transform:translate(-50%,-50%) rotate(-3deg) scale(1)}
canvas#confetti{position:fixed;inset:0;width:100%;height:100%;pointer-events:none;z-index:50}

/* footer controls */
.footer{position:fixed;left:0;right:0;bottom:0;display:flex;flex-wrap:wrap;gap:10px 12px;align-items:center;justify-content:center;
  padding:10px 12px calc(12px + env(safe-area-inset-bottom));z-index:20}
.footer .group{display:none;align-items:center;gap:12px;flex-wrap:wrap;justify-content:center}
.open .footer .group.when-open{display:flex}
.closed-hint{font-family:"Pinyon Script",cursive;font-size:26px;color:var(--wine);text-shadow:0 1px 0 rgba(255,240,215,.5)}
.open .closed-hint{display:none}
button.tag{font:600 17px/1 "Cormorant Garamond",Georgia,serif;color:var(--wine);cursor:pointer;
  background:#efe1c3;border:0;padding:10px 16px;letter-spacing:.02em;position:relative;
  box-shadow:0 2px 4px rgba(50,25,8,.4),inset 0 0 0 2px #efe1c3,inset 0 0 0 3px rgba(92,15,28,.55);
  clip-path:polygon(0 8%,6% 0,50% 4%,94% 0,100% 10%,98% 55%,100% 92%,60% 100%,25% 96%,2% 100%,0 60%);user-select:none;-webkit-user-select:none;touch-action:none}
button.tag:active,button.tag.down{background:#e4d1a8;transform:translateY(1px)}
button.tag[hidden]{display:none}
.meter{display:flex;align-items:center;gap:8px;font-size:15px;font-weight:600}
.bar{position:relative;width:86px;height:12px;background:rgba(92,15,28,.18);border-radius:7px;overflow:hidden;box-shadow:inset 0 1px 2px rgba(50,20,8,.45)}
.bar i{position:absolute;left:0;top:0;bottom:0;width:0;background:linear-gradient(90deg,#b4802b,#c23b2e 60%,var(--wine2))}
.bar b{position:absolute;top:0;bottom:0;width:2px;background:var(--cream);opacity:.9}
</style>
</head>
<body>
<div class="stage closed" id="stage">
  <div class="scrap a"></div><div class="scrap b"></div>
  <div class="scene">

        <div class="wish" id="wish">Make a wish, <span id="who"></span>!</div>
        <div class="tape tr"></div>
      </div>
      <div class="leaf" id="leaf" aria-label="Open the card">
        <div class="face front"><div class="tape tr"></div></div>
        <div class="face back">
          <div class="clip">
            <div id="letter" role="button" tabindex="0" aria-label="Read the letter"></div>
            <div class="front-env"></div>
          </div>
          <div class="tape tl"></div>
        </div>
      </div>
    </div>
  </div>
  <div class="footer">
    <div class="closed-hint">tap the cover to open</div>
    <div class="group when-open">
      <button class="tag" id="back" type="button">&larr; back to cover</button>
      <div class="meter" title="Microphone level"><span id="micstat">mic off</span><div class="bar"><i id="lvl"></i><b id="tick"></b></div></div>
      <button class="tag" id="hold" type="button">hold to blow</button>
      <button class="tag" id="relight" type="button" hidden>relight &#128367;&#65039;</button>
    </div>
  </div>
</div>
<canvas id="confetti"></canvas>

<script>
(function(){
"use strict";
var NAME = "baby";            // <-- the name shown in "Make a wish, ____!"
var BLOW_SECONDS = 0.5;       // how long you need to blow
var $ = function(id){return document.getElementById(id)};
var stage=$("stage"), leaf=$("leaf"), letter=$("letter"), left=document.querySelector(".face.back");
var flames=[$("f0"),$("f1"),$("f2")], wish=$("wish"), lvl=$("lvl"), tick=$("tick"), micstat=$("micstat");
var hold=$("hold"), relightBtn=$("relight"), back=$("back"), right=$("right");
$("who").textContent=NAME;
var isOpen=false, lit=true, blowTime=0, strength=0, manual=false, t0=performance.now();

/* ---------- open / close ---------- */
function setOpen(v){
  isOpen=v; stage.classList.toggle("open",v); stage.classList.toggle("closed",!v);
  if(v){ startMic(); }
  else{ tuck(); relight(true); stopMic(); }
}
leaf.addEventListener("click",function(){ if(!isOpen) setOpen(true); });
back.addEventListener("click",function(){ setOpen(false); });

/* ---------- letter lift ---------- */
function layoutLetter(){
  var pw=left.clientWidth, ph=left.clientHeight;
  var tl=.02593*pw, tt=.24323*ph, tw=.60741*pw, th=.45625*ph;
  var w2=.84*pw, s=w2/tw, h2=th*s, x2=(pw-w2)/2, y2=(ph-h2)/2;
  letter.style.setProperty("--ls",s); letter.style.setProperty("--lx",(x2-tl)+"px"); letter.style.setProperty("--ly",(y2-tt)+"px");
}
function tuck(){ letter.classList.remove("lifted"); }
function toggleLetter(e){ if(e) e.stopPropagation(); layoutLetter(); letter.classList.toggle("lifted"); }
letter.addEventListener("click",toggleLetter);
letter.addEventListener("keydown",function(e){ if(e.key==="Enter"){ e.preventDefault(); toggleLetter(); } });
window.addEventListener("resize",layoutLetter); layoutLetter();

/* ---------- microphone / blow detection ---------- */
var ctx=null, an=null, stream=null, timeBuf=null, freqBuf=null, micOn=false, floor=0.01, micRMS=0, lowRatio=0;
function setStatus(t){ micstat.textContent=t; }
function startMic(){
  if(micOn||!navigator.mediaDevices||!navigator.mediaDevices.getUserMedia){
    if(!navigator.mediaDevices){ setStatus("mic needs https"); } return; }
  navigator.mediaDevices.getUserMedia({audio:{echoCancellation:false,noiseSuppression:false,autoGainControl:false}}).then(function(s){
    if(!isOpen){ s.getTracks().forEach(function(t){t.stop()}); return; }
    stream=s; var AC=window.AudioContext||window.webkitAudioContext; ctx=new AC();
    if(ctx.resume) ctx.resume();
    var src=ctx.createMediaStreamSource(s); an=ctx.createAnalyser(); an.fftSize=1024; an.smoothingTimeConstant=0.15;
    src.connect(an); timeBuf=new Float32Array(an.fftSize); freqBuf=new Float32Array(an.frequencyBinCount);
    micOn=true; floor=0.01; setStatus("mic on");
  }).catch(function(){ setStatus("mic blocked"); });
}
function stopMic(){
  micOn=false; micRMS=0; lowRatio=0;
  if(stream){ stream.getTracks().forEach(function(t){t.stop()}); stream=null; }
  if(ctx){ try{ctx.close()}catch(e){} ctx=null; }
  setStatus("mic off");
}
function threshold(){ return Math.max(0.035, floor*5); }
function sample(){
  if(!micOn||!an) return;
  an.getFloatTimeDomainData(timeBuf); var s=0,i;
  for(i=0;i<timeBuf.length;i++) s+=timeBuf[i]*timeBuf[i];
  micRMS=Math.sqrt(s/timeBuf.length);
  an.getFloatFrequencyData(freqBuf); var lo=0,all=0,m;
  for(i=1;i<freqBuf.length;i++){ m=Math.pow(10,freqBuf[i]/10); all+=m; if(i<=14) lo+=m; }
  lowRatio=all>0?lo/all:0;
}

/* ---------- hold-to-blow fallback (button or spacebar) ---------- */
function holdOn(){ manual=true; hold.classList.add("down"); }
function holdOff(){ manual=false; hold.classList.remove("down"); }
hold.addEventListener("pointerdown",function(e){ e.preventDefault(); holdOn(); });
["pointerup","pointercancel","pointerleave"].forEach(function(ev){ hold.addEventListener(ev,holdOff); });
document.addEventListener("keydown",function(e){ if(e.code==="Space"&&isOpen){ e.preventDefault(); if(!e.repeat) holdOn(); } });
document.addEventListener("keyup",function(e){ if(e.code==="Space"){ holdOff(); } });
window.addEventListener("blur",holdOff);

/* ---------- flames ---------- */
function extinguish(){
  if(!lit) return; lit=false;
  flames.forEach(function(f,i){
    setTimeout(function(){
      f.classList.add("out");
      var r=f.getBoundingClientRect(), pr=right.getBoundingClientRect();
      var sm=document.createElement("div"); sm.className="smoke";
      sm.style.left=((r.left+r.width*.55-pr.left)/pr.width*100)+"%"; sm.style.top=((r.top+r.height*.75-pr.top)/pr.height*100)+"%";
      right.appendChild(sm); setTimeout(function(){ sm.remove(); },1900);
    },i*110);
  });
  setTimeout(function(){ wish.classList.add("show"); confetti(); },420);
  relightBtn.hidden=false; hold.hidden=true;
}
function relight(silent){
  lit=true; blowTime=0; strength=0;
  flames.forEach(function(f){ f.classList.remove("out"); });
  wish.classList.remove("show"); relightBtn.hidden=true; hold.hidden=false; confettiParts.length=0;
}
relightBtn.addEventListener("click",function(){ relight(); });

/* ---------- main loop ---------- */
var last=performance.now();
function frame(now){
  var dt=Math.min(.05,(now-last)/1000); last=now;
  var blowing=false, target=0;
  if(isOpen&&lit){
    sample();
    var thr=threshold();
    if(micOn){
      if(micRMS<thr) floor+= (micRMS-floor)*.02;
      if(micRMS>thr && lowRatio>.4){ blowing=true; target=Math.min(1,(micRMS-thr)/(thr*2.5)+.35); }
    }
    if(manual){ blowing=true; target=Math.max(target,.85); }
    if(blowing) blowTime+=dt; else blowTime=Math.max(0,blowTime-dt*1.5);
    if(blowTime>=BLOW_SECONDS) extinguish();
  }
  strength+=(target-strength)*Math.min(1,dt*12);
  /* meter */
  var shown=manual?.85:(micOn?Math.min(1,micRMS/(threshold()*2.2)):0);
  lvl.style.width=(shown*100)+"%"; tick.style.left=(100/2.2)+"%";
  /* flame transforms */
  if(lit){
    var t=(now-t0)/1000;
    for(var i=0;i<flames.length;i++){
      var fl=Math.sin(t*7+i*2.1)*1.6+Math.sin(t*13+i)*.9;
      var ang=fl*(1-strength*.6)+strength*(34+Math.sin(t*28+i)*6);
      var sy=1+Math.sin(t*9+i*1.3)*.03-strength*.28, sx=1-strength*.1;
      flames[i].style.transform="rotate("+ang.toFixed(2)+"deg) scale("+sx.toFixed(3)+","+sy.toFixed(3)+")";
    }
  }
  drawConfetti(dt);
  requestAnimationFrame(frame);
}
requestAnimationFrame(frame);

/* ---------- confetti ---------- */
var cv=$("confetti"), cx=cv.getContext("2d"), confettiParts=[];
function sizeCv(){ var d=window.devicePixelRatio||1; cv.width=innerWidth*d; cv.height=innerHeight*d; cx.setTransform(d,0,0,d,0,0); }
window.addEventListener("resize",sizeCv); sizeCv();
function confetti(){
  var cols=["#7a1526","#a8283a","#f6edd8","#d9b46a","#c6a273","#e8c9c0","#5c0f1c"];
  var pr=right.getBoundingClientRect(), ox=pr.left+pr.width/2, oy=pr.top+pr.height*.45;
  for(var i=0;i<160;i++){
    var a=Math.random()*Math.PI*2, v=240+Math.random()*520;
    confettiParts.push({x:ox,y:oy,vx:Math.cos(a)*v,vy:Math.sin(a)*v-380,w:6+Math.random()*7,h:4+Math.random()*5,
      r:Math.random()*6,vr:(Math.random()-.5)*14,c:cols[i%cols.length],life:2.6+Math.random()*1.6,age:0});
  }
}
function drawConfetti(dt){
  cx.clearRect(0,0,innerWidth,innerHeight);
  for(var i=confettiParts.length-1;i>=0;i--){
    var p=confettiParts[i]; p.age+=dt; if(p.age>p.life){ confettiParts.splice(i,1); continue; }
    p.vy+=900*dt; p.vx*=.992; p.vy*=.992; p.x+=p.vx*dt; p.y+=p.vy*dt; p.r+=p.vr*dt;
    cx.globalAlpha=Math.min(1,(p.life-p.age)*1.2); cx.save(); cx.translate(p.x,p.y); cx.rotate(p.r);
    cx.scale(1,Math.abs(Math.cos(p.r*1.7))*.9+.1); cx.fillStyle=p.c; cx.fillRect(-p.w/2,-p.h/2,p.w,p.h); cx.restore();
  }
  cx.globalAlpha=1;
}
/* test hooks (harmless) */
window.__card={isOpen:function(){return isOpen},lit:function(){return lit},micOn:function(){return micOn},blowTime:function(){return blowTime}};
})();
</script>
